name: PBS monthly acceptance construction
on:
  push:
    branches: [construction/monthly-work-acceptance]
  pull_request:
    paths: ['acceptance-src/**', 'acceptance-tests/**', 'account-acceptance.html', 'vendor/pbs-account-acceptance*', '.github/workflows/pbs-monthly-acceptance.yml']
permissions:
  contents: read
jobs:
  monthly-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix acceptance-tests
      - run: npm test --prefix acceptance-tests
      - name: Verify pinned browser bundle
        run: |
          NODE_PATH=acceptance-tests/node_modules acceptance-tests/node_modules/.bin/esbuild acceptance-src/account-acceptance-entry.mjs --bundle --minify --format=iife --outfile=vendor/pbs-account-acceptance.js --legal-comments=linked
          git diff --exit-code -- vendor/pbs-account-acceptance.js vendor/pbs-account-acceptance.js.LEGAL.txt
      - name: Chrome mobile and desktop initialization
        run: node acceptance-tests/browser-monthly.cjs
